<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glendale Estates Condominium — Declaration & Amendments Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="mode-current">

<!-- SIDEBAR -->
<div id="navOverlay" onclick="toggleNav(false)"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <h1>Glendale Estates</h1>
    <div class="sub">Declaration &amp; Amendments</div>
    <div class="header-actions">
      <a class="orig-doc-link" href="GEC-Declaration.pdf" download title="Download the original recorded Declaration (PDF)">
        <span class="doc-icon">&#128196;</span><span class="doc-label"> Original document (PDF)</span>
      </a>
      <button class="header-btn" id="searchToggleBtn" onclick="toggleSearch()" aria-label="Toggle search" title="Search">&#128269;</button>
      <button class="header-btn" id="bookmarksToggleBtn" onclick="toggleBookmarks()" aria-label="Toggle bookmarks" title="Bookmarked">&#11088;</button>
    </div>
  </div>

  <div class="search-box search-hidden" id="searchBox">
    <input type="text" id="secSearch" placeholder="Filter sections or topics..." onkeyup="filterNav()">
  </div>

  <!-- FIXED FAVORITES (toggled from header, hidden by default) -->
  <div class="fav-panel fav-hidden" id="favPanel">
    <div id="favoritesNavList" class="fav-list"></div>
  </div>

  <div class="nav-scroll" id="navScroll">
    <!-- DETAILED GRANULAR TOC -->
    <div id="tocRoot"></div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="burger" onclick="toggleNav()" aria-label="Toggle contents">&#9776;</button>
      <div class="global-mode-selector">
        <button class="global-mode-btn mode-current-btn active" onclick="setGlobalDiffMode('current')">Current</button>
        <button class="global-mode-btn mode-amend-btn" onclick="setGlobalDiffMode('inline')">Amendments</button>
      </div>
      <div class="text-size-selector" role="group" aria-label="Text size">
        <button class="text-size-btn" onclick="stepReadingScale(-1)" aria-label="Smaller text" title="Smaller text">A&minus;</button>
        <button class="text-size-btn text-size-reset" onclick="resetReadingScale()" aria-label="Reset text size" title="Reset text size">A</button>
        <button class="text-size-btn" onclick="stepReadingScale(1)" aria-label="Larger text" title="Larger text">A+</button>
      </div>
    </div>
  </div>

  <div class="content-wrapper">
    <div id="docRoot"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  // Mobile TOC drawer
  function toggleNav(force) {
    const open = force === undefined ? !document.body.classList.contains('nav-open') : force;
    document.body.classList.toggle('nav-open', open);
  }

  // Unified single point of navigation logic
  function performScroll(targetId) {
    if (window.matchMedia('(max-width: 880px)').matches) toggleNav(false);
    if (!targetId) {
      document.getElementById('main').scrollTop = 0;
      updateActiveNavItem('');
      return;
    }
    const el = document.getElementById(targetId);
    if (el) {
      revealNavFor(targetId);
      const main = document.getElementById('main');
      main.scrollTop = el.offsetTop - 70;
      updateActiveNavItem(targetId);
    }
  }

  // Handle all hash changes natively (TOC, Favorites, Back/Forward browser buttons)
  window.addEventListener('hashchange', () => {
    const id = window.location.hash.replace('#', '');
    performScroll(id);
  });

  // Favorite clicks must always act, even when the hash is unchanged
  // (you may already be at that section), so route them through performScroll.
  function favJump(e, id) {
    e.preventDefault();
    if (window.location.hash === '#' + id) {
      performScroll(id);
    } else {
      window.location.hash = id;
    }
  }

  // Handle direct page load / refresh
  window.addEventListener('DOMContentLoaded', () => {
    applyReadingScale();
    renderAll();
    buildTOC();
    loadFavorites();
    applyBookmarksState();
    initScrollSpy();
    const id = window.location.hash.replace('#', '');
    if (id) {
      setTimeout(() => performScroll(id), 50);
    }
  });

  /* --- READING TEXT SIZE (scales section + TOC text only, not chrome) --- */
  const READING_SCALE_MIN = 0.8, READING_SCALE_MAX = 2.6, READING_SCALE_STEP = 0.1;
  function getReadingScale() {
    const v = parseFloat(localStorage.getItem('gec_reading_scale'));
    return (isFinite(v) && v > 0) ? v : 1;
  }
  function applyReadingScale() {
    const s = Math.min(READING_SCALE_MAX, Math.max(READING_SCALE_MIN, getReadingScale()));
    document.body.style.setProperty('--reading-scale', String(s));
    document.querySelectorAll('.text-size-reset').forEach(b => {
      b.classList.toggle('active', Math.abs(s - 1) > 0.001);
    });
  }
  function stepReadingScale(dir) {
    let s = getReadingScale() + dir * READING_SCALE_STEP;
    s = Math.round(Math.min(READING_SCALE_MAX, Math.max(READING_SCALE_MIN, s)) * 100) / 100;
    localStorage.setItem('gec_reading_scale', String(s));
    applyReadingScale();
  }
  function resetReadingScale() {
    localStorage.setItem('gec_reading_scale', '1');
    applyReadingScale();
  }

  /* --- DYNAMIC COLLAPSIBLE TABLE OF CONTENTS --- */
  let tocAutoId = 0;

  function escAttr(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function prettySectionTitle(raw) {
    let t = (raw || '').replace(/\s+/g, ' ').trim();
    let m = t.match(/^SECTION\s+(\S+?):?\s+(.*)$/i);
    if (m) return 'Sec ' + m[1] + ': ' + titleCase(m[2]);
    m = t.match(/^(APPENDIX|EXHIBIT)\s+"?([A-Z0-9]+)"?:?\s*(.*)$/i);
    if (m) {
      const kind = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
      return kind + ' ' + m[2] + (m[3] ? ': ' + titleCase(m[3]) : '');
    }
    return t;
  }

  function titleCase(s) {
    return String(s).toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase());
  }

  // Gather subsections in document order via .toc-node markers emitted by the renderer.
  function collectSubsections(sec) {
    const body = sec.querySelector('.section-body');
    if (!body) return [];
    const out = [];
    body.querySelectorAll('.toc-node').forEach(el => {
      const id = el.id;
      if (!id) return;
      out.push({ id, label: el.getAttribute('data-toc-label') || id });
    });
    return out;
  }

  function buildTOC() {
    const root = document.getElementById('tocRoot');
    if (!root) return;
    const sections = document.querySelectorAll('#main section.doc-section');
    let html = '';
    html += '<div class="nav-group-title">Table of Contents</div>';
    html += '<div class="toc-controls">'
          + '<span onclick="tocExpandAll(true)">Expand all</span>'
          + '<span onclick="tocExpandAll(false)">Collapse all</span>'
          + '</div>';
    let appendixHeaderDone = false;

    sections.forEach(sec => {
      const secId = sec.id;
      if (!secId) return; // skip preamble / unlabeled sections
      if (/^(appendix|exhibit)/i.test(secId) && !appendixHeaderDone) {
        html += '<div class="nav-group-title">Appendices &amp; Schedules</div>';
        appendixHeaderDone = true;
      }
      const titleEl = sec.querySelector('.section-header h2 span') || sec.querySelector('.section-header h2');
      const rawTitle = titleEl ? titleEl.textContent : secId;
      const secTitle = prettySectionTitle(rawTitle);
      const subs = collectSubsections(sec);
      const hasSubs = subs.length > 0;

      html += '<div class="toc-sec" data-sec="' + escAttr(secId) + '">';
      html += '<div class="toc-sec-row">';
      html += hasSubs
        ? '<span class="toc-toggle">+</span>'
        : '<span class="toc-toggle empty"></span>';
      html += '<a href="#' + escAttr(secId) + '" class="nav-item toc-sec-link">'
            + '<span>' + escAttr(secTitle) + '</span>'
            + '<button class="nav-star-btn" data-target="' + escAttr(secId) + '" data-title="' + escAttr(secTitle) + '">\u2605</button>'
            + '</a>';
      html += '</div>';
      if (hasSubs) {
        html += '<div class="toc-sublist" style="display:none;">';
        subs.forEach(s => {
          html += '<a href="#' + escAttr(s.id) + '" class="nav-item sub-item">'
                + '<span>' + escAttr(s.label) + '</span>'
                + '<button class="nav-star-btn" data-target="' + escAttr(s.id) + '" data-title="' + escAttr(s.label) + '">\u2605</button>'
                + '</a>';
        });
        html += '</div>';
      }
      html += '</div>';
    });

    root.innerHTML = html;

    // Wire up interactions (avoids inline-onclick quoting issues with labels).
    root.querySelectorAll('.nav-star-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(btn.getAttribute('data-target'), btn.getAttribute('data-title'));
      });
    });
    root.querySelectorAll('.toc-toggle:not(.empty)').forEach(t => {
      t.addEventListener('click', () => tocToggle(t));
    });
  }

  function tocToggle(el) {
    const sec = el.closest('.toc-sec');
    if (!sec) return;
    const sl = sec.querySelector('.toc-sublist');
    if (!sl) return;
    const open = sl.style.display !== 'none';
    sl.style.display = open ? 'none' : 'block';
    el.textContent = open ? '+' : '\u2212';
  }

  function tocExpandAll(open) {
    document.querySelectorAll('#tocRoot .toc-sec').forEach(sec => {
      const sl = sec.querySelector('.toc-sublist');
      if (!sl) return;
      sl.style.display = open ? 'block' : 'none';
      const tg = sec.querySelector('.toc-toggle');
      if (tg && !tg.classList.contains('empty')) tg.textContent = open ? '\u2212' : '+';
    });
  }

  // Expand the section that contains the target so the active item is visible.
  function revealNavFor(id) {
    const link = document.querySelector('#tocRoot a.nav-item[href="#' + id + '"]');
    if (!link) return;
    let sl = link.closest('.toc-sublist');
    if (!sl) {
      const sec = link.closest('.toc-sec');
      sl = sec && sec.querySelector('.toc-sublist');
    }
    if (sl) {
      sl.style.display = 'block';
      const sec = sl.closest('.toc-sec');
      const tg = sec && sec.querySelector('.toc-toggle');
      if (tg && !tg.classList.contains('empty')) tg.textContent = '\u2212';
    }
  }

  function updateActiveNavItem(id) {
    const navLinks = document.querySelectorAll('#navScroll a.nav-item');
    navLinks.forEach(link => {
      link.classList.remove('active');
      const href = link.getAttribute('href') || '';
      if (href === '#' + id && id !== '') {
        link.classList.add('active');
      }
    });
  }

  /* --- SCROLL SPY: keep the TOC in sync with the section/subsection in view --- */
  function scrollTocActiveIntoView() {
    const pane = document.getElementById('navScroll');
    if (!pane) return;
    const link = pane.querySelector('#tocRoot a.nav-item.active');
    if (!link) return;
    const lr = link.getBoundingClientRect();
    const pr = pane.getBoundingClientRect();
    if (lr.top < pr.top + 16 || lr.bottom > pr.bottom - 16) {
      pane.scrollTop += (lr.top - pr.top) - (pane.clientHeight / 2) + (link.offsetHeight / 2);
    }
  }

  function initScrollSpy() {
    const main = document.getElementById('main');
    if (!main) return;
    const targets = Array.from(
      document.querySelectorAll('#main section.doc-section[id], #main .toc-node[id]')
    );
    if (!targets.length) return;
    let ticking = false, lastId = null;
    function update() {
      ticking = false;
      const mainTop = main.getBoundingClientRect().top;
      const probe = 96; // px below the top of the reading pane
      let currentId = targets[0].id;
      for (const el of targets) {
        if (el.getBoundingClientRect().top - mainTop <= probe) currentId = el.id;
        else break;
      }
      if (currentId === lastId) return;
      lastId = currentId;
      revealNavFor(currentId);
      updateActiveNavItem(currentId);
      scrollTocActiveIntoView();
    }
    main.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }, { passive: true });
    update();
  }

  /* --- FAVORITES MANAGEMENT --- */
  let favorites = JSON.parse(localStorage.getItem('gec_favorites') || '[]');

  function saveFavorites() {
    localStorage.setItem('gec_favorites', JSON.stringify(favorites));
    renderFavorites();
  }

  function toggleFavorite(id, title) {
    const idx = favorites.findIndex(f => f.id === id);
    if (idx >= 0) {
      favorites.splice(idx, 1);
    } else {
      favorites.push({ id, title });
    }
    saveFavorites();
  }

  function toggleFavEvent(e, id, title) {
    e.preventDefault();
    e.stopPropagation();
    toggleFavorite(id, title);
  }

  function removeFavorite(id) {
    favorites = favorites.filter(f => f.id !== id);
    saveFavorites();
  }

  function renderFavorites() {
    const container = document.getElementById('favoritesNavList');

    // Update star icons across page & TOC
    document.querySelectorAll('.star-btn, .nav-star-btn').forEach(btn => {
      const target = btn.getAttribute('data-target');
      if (favorites.some(f => f.id === target)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    if (favorites.length === 0) {
      container.innerHTML = '<div class="fav-empty">No bookmarks</div>';
      return;
    }

    let html = '';
    favorites.forEach(f => {
      html += `
        <a href="#${f.id}" class="nav-item" onclick="favJump(event, '${f.id}')">
          <span style="font-size:12px; color:#fef08a;">★ ${f.title}</span>
          <span style="color:#ef4444; font-size:19px; font-weight:bold; padding:0 6px;" onclick="event.preventDefault(); event.stopPropagation(); removeFavorite('${f.id}')" title="Remove">×</span>
        </a>
      `;
    });
    container.innerHTML = html;
  }

  function loadFavorites() {
    renderFavorites();
  }

  /* --- HEADER TOGGLES: search + bookmarks (both hidden by default) --- */
  function toggleSearch() {
    const box = document.getElementById('searchBox');
    const btn = document.getElementById('searchToggleBtn');
    if (!box) return;
    const hidden = box.classList.toggle('search-hidden');
    if (btn) btn.classList.toggle('active', !hidden);
    if (!hidden) {
      const input = document.getElementById('secSearch');
      if (input) input.focus();
    }
  }
  function toggleBookmarks() {
    const p = document.getElementById('favPanel');
    const btn = document.getElementById('bookmarksToggleBtn');
    if (!p) return;
    const hidden = p.classList.toggle('fav-hidden');
    localStorage.setItem('gec_bookmarks_open', hidden ? '0' : '1');
    if (btn) btn.classList.toggle('active', !hidden);
  }
  function applyBookmarksState() {
    const p = document.getElementById('favPanel');
    const btn = document.getElementById('bookmarksToggleBtn');
    if (!p) return;
    const open = localStorage.getItem('gec_bookmarks_open') === '1';
    p.classList.toggle('fav-hidden', !open);
    if (btn) btn.classList.toggle('active', open);
  }

  /* --- DIFF VIEW CONTROLS (data-pane = amendment id or 'redline') --- */
  function activeClassFor(box, mode) {
    if (mode === 'redline') return 'active-redline';
    if (box && box.getAttribute('data-earliest') === mode) return 'active-orig';
    if (box && box.getAttribute('data-latest') === mode) return 'active-current';
    return 'active-mid';
  }

  function setDiffBoxMode(boxId, mode) {
    const box = document.getElementById(boxId);
    if (!box) return;
    box.querySelectorAll('.diff-view-pane').forEach(pane => {
      pane.style.display = (pane.getAttribute('data-pane') === mode) ? 'block' : 'none';
    });
    box.querySelectorAll('.diff-mode-btn').forEach(btn => {
      btn.classList.remove('active-redline', 'active-current', 'active-orig', 'active-mid');
      if (btn.getAttribute('data-mode') === mode) btn.classList.add(activeClassFor(box, mode));
    });
    // Consolidated subsections: hide when viewing a year before they existed.
    const sub = box.querySelector(':scope > .diff-subnodes');
    if (sub) {
      const subAdded = parseInt(box.getAttribute('data-subadded') || '0', 10);
      const ym = mode === 'redline' ? 9999 : (parseInt(mode, 10) || 9999);
      sub.style.display = (subAdded && ym < subAdded) ? 'none' : 'block';
    }
  }

  // Global modes: Current (clean final text) vs Inline (amendment provenance).
  // A single body class drives all styling — no per-node rebuilding needed.
  function setGlobalDiffMode(mode) {
    document.querySelectorAll('.global-mode-btn').forEach(btn => {
      const onc = btn.getAttribute('onclick') || '';
      btn.classList.toggle('active', onc.indexOf("'" + mode + "'") >= 0);
    });
    document.body.classList.toggle('mode-inline', mode === 'inline');
    document.body.classList.toggle('mode-current', mode !== 'inline');
  }

  function filterNav() {
    const input = document.getElementById('secSearch').value.toLowerCase().trim();

    // Favorites list items live outside the TOC tree — filter them directly.
    document.querySelectorAll('#favoritesNavList a.nav-item').forEach(item => {
      item.style.display = (!input || item.textContent.toLowerCase().includes(input)) ? 'flex' : 'none';
    });

    const secs = document.querySelectorAll('#tocRoot .toc-sec');

    if (!input) {
      // Restore default: all sections visible, sublists collapsed.
      secs.forEach(sec => {
        sec.style.display = '';
        sec.querySelectorAll('a.nav-item').forEach(l => l.style.display = 'flex');
        const sl = sec.querySelector('.toc-sublist');
        if (sl) sl.style.display = 'none';
        const tg = sec.querySelector('.toc-toggle');
        if (tg && !tg.classList.contains('empty')) tg.textContent = '+';
      });
      return;
    }

    secs.forEach(sec => {
      let any = false;
      sec.querySelectorAll('.toc-sublist a.nav-item').forEach(l => {
        const m = l.textContent.toLowerCase().includes(input);
        l.style.display = m ? 'flex' : 'none';
        if (m) any = true;
      });
      const secLink = sec.querySelector('.toc-sec-link');
      const secMatch = secLink && secLink.textContent.toLowerCase().includes(input);
      const visible = any || secMatch;
      sec.style.display = visible ? '' : 'none';
      if (secLink) secLink.style.display = visible ? 'flex' : 'none';
      const sl = sec.querySelector('.toc-sublist');
      if (sl) sl.style.display = any ? 'block' : 'none';
      const tg = sec.querySelector('.toc-toggle');
      if (tg && !tg.classList.contains('empty')) tg.textContent = any ? '\u2212' : '+';
    });
  }
</script>

</body>
</html>
